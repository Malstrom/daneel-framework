  Known limitations (2026-09-28, tracker ml_team-816):
    - the 30-day 'book is not new' rule and the shop-age flag are evaluated
      once per batch at window_end, not per day: in a weekly batch a book that
      crosses 30 days mid-week is judged as of the last day, up to six days of
      misclassification per batch; the daily DAG has the same granularity;
    - widening the shop set (young, transport-stopped and fair points inside
      channel 1) also widens the stock used to compute a book's first_seen, so
      some books may now look older than in the previous table (not measured);
    - retail_shops_info appears to keep only the current state
      (ReplacingMergeTree, ~1.3k rows, read without FINAL), so eligibility must
      be read from the stored flags later, not re-derived by joining today's
      row with today(). Unmerged duplicate rows of a point would duplicate its
      stock rows through the join (same pattern as in the old module; not
      checked). If date_opened is NULL the flag is NULL; how that lands in the
      UInt8 column was not checked;
    - the table is stock-driven (a row exists only where wh_remainder_shops has
      a row), so days with zero stock are absent, exactly as in the old table;
    - recsys_catalog_pim appears to hold only the current state, so category
      and availability of a 2024 row probably reflect today's catalog (to be
      confirmed with the table owner);
    - the notebook keeps its own copy of the SQL while the DAG uses
      bdf_core_full_sql.py. On 2026-09-28 the two were identical after
      whitespace normalisation; a query change has to be made in both places.
      The DDL cell of the notebook is commented out after the reload, so
      rerunning the notebook top to bottom does not recreate the table;
    - the old showcase table still joins sales to stock on goods_id_original
      (sales_daily in book_demand_showcase_core_sql.py on master), while its
      stock side uses goods_id. If goods_id_original is the cash system's own
      item id for Artix, as the table owner reports, Artix sales in it are lost
      or attributed to wrong titles; the size of this effect on the old table
      was not measured. A separate decision is needed because three forecast
      pipelines read that table.

  Findings worth reusing (2026-09, tracker ml_team-816):
    - id spaces in cdm_retail_receipts. The source_id mapping (1 = SetRetail,
      2 = UKM, 3 = Artix) comes from loader file names and comments in the repo.
      The semantics of goods_id and goods_id_original are as reported by
      chaudhari.m in a direct reply to the operator on 2026-09-23: goods_id is
      the cleaned book id for all three systems; goods_id_original is the cash
      system's own item id for Artix (not a book id) and, for SetRetail/UKM, a
      book id with a possible +5000000 offset (the owner described these as
      defect items; a column comment in the repo describes the offset as 'item
      as in the source, +5000000 for BK' and goods_id as 'item without
      offset'). Measured since 2024-01-01: 253.0M rows from source 1 and 7.56M
      from source 3; for source 3, 4.09M rows (54%) have goods_id !=
      goods_id_original and goods_id_original is never NULL. This is
      consistent with the open question of 2026-08-04 above (goods_id_original
      matched 94.5% of current stock ids, goods_id 99.8%) and supersedes the
      2026-08-02 entry, which switched sales from goods_id to goods_id_original
      and called it verified; that switch is still in the old table. The two
      sets of figures are not reconciled (distinct stock ids versus row
      counts, and the split between Artix ids and offset ids was not
      measured). ncat_first_180d_period_sales.py uses goods_id only for
      source_id = 3 and goods_id_original otherwise; sales in bdf_core_full use
      goods_id for all sources;
    - offline sales that fulfil an online order: static_view_lake_orders_on,
      order_type_cor = if(site_id = 2 AND order_type IS NULL, 1, order_type),
      joined on (goods_soft_check_number = barcode, book id = book_id_origin).
      Per the operator, order_type_cor = 1 is a pure online order not served
      from a shop shelf, while other types (2 = marketplace orders) still take
      the book from a shelf and stay in the table; this reading of the codes
      comes from the operator, not from a documented dictionary or the table
      owner. First week only (2024-01-01..07): 443,471 qualifying sales lines,
      6,852 with a barcode, 6,850 matched to an order line, of which 6,718 are
      type 2 and 132 type 1; only the 132 are excluded. The distribution over
      the full period is unknown, and other scripts in the repo group the
      values 1, 5 and 6 together, so whether other codes should be excluded too
      was not checked. The exclusion is written as (barcode IS NULL OR
      (barcode, book) NOT IN (type-1 lines)) so lines without a barcode stay;
      an inner-join formulation would drop them;
    - operation_type = 0 means 'normal receipt, not a return' (comment in two
      pipelines) and is added next to is_normal / goods_storno. The SQL files
      that build cdm_retail_receipts (dags/scripts/cdm/set_retail_receipts/sql)
      define is_normal as status != CANCELLED and goods_type = 0, while a
      lakehouse job with a status-only variant writes a different table; this
      was not traced to the exact file, so the explicit filter is kept;
    - memory. With the whole network the per-batch query first died with Code
      241 (48 GiB per-query limit) in DISTINCT over the (shop, book) pairs of
      the 180-day lookback. Measured for the first batch: ~3.6B rows read, 635
      shops, ~380k books, ~23.7M distinct pairs. Estimate, not measured: one
      128-bit hash set of that size takes roughly 1 GiB, and if each of the 40
      threads (max_threads = 40) held its own copy that would approach the 48
      GiB limit. A second failure came from casting the big table's id to
      String for comparison; casting the small lookup side to a number fixed
      it. Two per-query settings (optimize_distinct_in_order,
      optimize_aggregation_in_order) were tried once and did not help, probably
      because the sort key of wh_remainder_shops is (ondate, pt_id), not the
      DISTINCT key. After that the operator ruled out any settings changes on
      the shared production server and the query was rewritten: every window
      row with rem > 0 already proves that its (shop, book) pair had stock in
      the lookback, so the pair set is redundant for such rows and shops and
      books are filtered independently. Result: 2.46 GiB in use at second 149
      of the first batch's ~178 s (a mid-run reading, not a recorded peak);
      later batches averaged 3.6 minutes, so the full reload takes roughly
      8.5-9 hours wall-clock. The expected behavioural difference of the
      rewrite is rows with rem <= 0 on pairs that never had positive stock:
      none were found in the first loaded week, and section 3 of the
      comparison found 0 such rows among the 101M extra rows;
    - storage (first full load, before the flag columns were added): 14.75B
      rows took 27.27 GiB, 1.99 bytes/row (book_id 0.90, stock_rem 1.02, the
      rest ~0.07). Delta+ZSTD cut book_id from 4.11 to ~0.86-0.90 bytes/row
      (~4.5-4.8x). Narrower integer types were rejected: stock_rem reached 307
      on the part of the table loaded at that time (does not fit UInt8), and
      type width barely matters after compression (qty_sold is ~0 bytes even as
      Int32); LowCardinality does not fit ~440k distinct books;
    - comparison with the old table over its own range (Moscow, Chitai-Gorod
      and Bukvoed brands only), on the earlier version of the new table (before
      the flag columns; it ends on 2026-09-22, a day or more before the old
      range ends, so growth is slightly understated). Run of 2026-09-24 over
      2025-07-31..2026-09-23: old 554.3M rows / 84 shops / 114,925 books /
      quantity 3.80M; new 629.0M / 80 / 146,934 / 4.18M, i.e. +13.5% rows,
      +27.9% books, +10% quantity, 4 fewer shops. A later saved rerun over
      2025-07-31..2026-09-26 shows old 558.4M / 84 / 115,156 / 3.83M against
      the same new figures. Section 3 of that notebook (saved output): of
      101.3M rows present in the new table but not in the old one, 75.6M
      (74.6%) belong to books of the old rubric exclusion list, 0 have
      stock_rem <= 0, and 25.7M (25.4%) are explained by neither cause.
      Conversely about 30.7M old rows do not exist in the new table (about 5.5M
      of them are days after 2026-09-22; the rest is probably the 4 missing
      shops, unverified). Sections 7 (missing shops) and 8 (rubric breakdown)
      have no saved output, so the fair filter as the reason for the 4 missing
      shops is not verified; the switch of the sales key, the online-order
      exclusion and the wider first_seen are further candidate causes that were
      not measured. Every check must be rerun on the reloaded table, where fair
      shops are included by design.

  Operational pitfalls (2026-09, tracker ml_team-816):
    - restarting the load loop without deleting the checkpoint silently skips
      every batch already marked done; tqdm then shows an absurd speed and the
      old logic stays in those weeks. This happened once: 85 weeks stayed on the
      previous logic. After any change of the query or the schema: drop or
      truncate the table, delete the checkpoint, rerun all batches;
    - results shown in a live notebook are not on disk until it is saved, so
      anyone reading the .ipynb file or a script sees stale outputs;
    - UNION ALL of sum() over UInt32 and Int32 columns fails with 'no supertype
      for Int64, UInt64': cast both sides with toInt64;
    - NOT IN over a (Date, UInt64, UInt64) tuple against a 550M-row table needs
      a 256-bit hash set and runs out of memory; compare cityHash64 of the tuple
      instead (collision risk is negligible for a diagnostic);
    - connection credentials are hard-coded in the scratch notebooks; keep them
      out of repositories and playbooks and move them to a connection config
      before a notebook is shared;
    - likely contacts for the source tables (ownership inferred from git
      history, not confirmed with them): chaudhari.m (receipts loaders and
      DAGs of the order tables), turganov.a (scripts of the orders table),
      eskerov.s (started the UKM loader), krukovskiy.ap
      (ncat_first_180d_period_sales.py).

