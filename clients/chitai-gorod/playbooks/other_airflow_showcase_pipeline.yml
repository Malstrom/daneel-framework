  Requests from the lead and what was done with them (2026-09-23 and
  2026-09-27, tracker ml_team-816). Status per request, with reasons, for
  review with the lead.
    2026-09-23, implemented:
    - operation_type = 0 was added to the sales filter (normal receipt, not a
      return);
    - sales lines that fulfil an online order of type order_type_cor = 1 are
      excluded, lines without a barcode stay (details under Findings).
    2026-09-27, request 1: remove the shop eligibility filters from the load.
    - Done for three conditions ('open >= 180 days', 'transport not stopped',
      'not a fair'). They no longer remove rows: they are computed per batch at
      window_end and stored as flag columns, so the shop-level part of the old
      selection can be reproduced with one predicate (WHERE shop_open_180d AND
      shop_transport_ok AND NOT shop_is_fair) and shops the business may need
      later stay in the table. The reloaded table has not been checked yet.
    - channel_id = 1 is still applied as a hard filter; the decision is open.
      Its removal was requested and was not applied because retail_shops_info
      holds about 1.34k points: 944 with channel_id 1, 386 with 0 and 12 with
      channels 3, 4 and 5 (10, 1 and 1 points). A sample of 30 of the 386
      channel-0 points is mostly non-retail objects: warehouses, a
      distribution centre, wholesale sections, a transport service, returns and
      defect receiving points, a reading room and fair stands. Their share of
      stock and sales was not measured, so it is not known how much demand
      keeping them out removes. Two other pipelines in the repo comment
      channel_id = 1 as offline retail; the shop loaders also fill a missing
      channel with 0 (isnull(channel_id, 0) in rt_shops_info.py), so 0 may
      partly mean 'not set'. If the lead wants these points, the safer form is
      an explicit channel column with a documented filter, not silent
      inclusion.
    - date_closed is still applied as a hard filter; the decision is open. It
      is evaluated at each batch's window_end, so it only drops points already
      closed on that date (a point that closes mid-batch is dropped from the
      whole batch, including days it still traded), and historical rows of
      now-closed points stay, so it does not fully stop closed points from
      accumulating. Its effect on size was not measured and is probably small.
      It can become a fourth flag the same way as the other three.
    2026-09-27, request 2: drop two source-side filters.
    - The sale_time +/- 2 day bounds on cdm_retail_receipts are kept. They
      should not change the result if operation_day is always within 2 days of
      sale_time (not checked). They are kept because the table is partitioned
      by toYYYYMM(sale_time) with a sort key that starts with purchase and
      position ids (checked in system.tables), so removing the bounds would
      probably lose partition pruning; pitfall (3) of the root playbook
      describes the same effect. Removal was not benchmarked.
    - available_for_sale = 1 in the catalog filter is unchanged; the decision
      is pending. Removing it would admit delisted books for periods when they
