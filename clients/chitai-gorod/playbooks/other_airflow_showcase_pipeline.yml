context:
  problem: >
    Need a scheduled Airflow pipeline that keeps a ClickHouse showcase/vitrina
    table (day x shop x book grain) up to date, joining stock and sales data
    filtered to a specific set of shops, catalog categories and rubrics for
    Chitai-Gorod / Bukvoed stores in Moscow.
  outcome: >
    Shipped as a first version: a single daily DAG that re-processes a rolling
    7-day window (delete + insert) instead of the originally-scoped
    init-DAG + strict "yesterday only" daily DAG. No init/backfill DAG exists
    yet — the target table must already exist and be backfilled manually
    before the daily DAG is enabled. Deviates from the original issue spec in
    two ways: (1) no 1-year backfill DAG, (2) daily DAG overwrites a 7-day
    window instead of failing if yesterday already has data. Known first-version
    gap, expected to be corrected in a follow-up iteration.

steps:
  - "Define a shared SQL module (`*_sql.py`) exposing `TABLE_NAME`, `CLICKHOUSE_CONN_ID`, and a `build_insert_sql_window(window_start, window_end)` function that returns the full INSERT ... SELECT query, with all client-specific filters (eligible shops, catalog rubric exclusions, eligible categories) inlined as CTEs."
  - "Define a loader module (`*_loader.py`) with `run_window_load(window_start, window_end)`: open the ClickHouse client via the shared connection wrapper (`ch_s53` / conn_id from step 1), log the pre-window row count, `ALTER TABLE ... DELETE` the window with `mutations_sync=1`, assert the post-delete count is 0 (raise `AirflowFailException` otherwise), run the insert from step 1, assert the post-insert count is > 0 (raise otherwise)."
  - "Define the daily DAG (`dag_n_<name>_daily.py`): fixed `start_date` (never `days_ago`), a nightly `schedule_interval`, `catchup=False`, `max_active_runs=1`, an `on_failure_callback` to the team's alert channel, and a single `@task` that computes the rolling window `[today - N days, today - 1]` and calls `run_window_load`."
  - "If a downstream DAG consumes this table (e.g. a forecast pipeline), chain a `TriggerDagRunOperator(wait_for_completion=False, reset_dag_run=True)` after the load task."
  - "Tag the DAG with team/domain/cadence tags (e.g. `clickhouse`, `showcase`, `<domain>`, `daily`, `<team>`) for discoverability."
  - "Before enabling the schedule, trigger the DAG manually once and confirm row counts in the task logs; only then let it run on schedule."
  - "Load a multi-year history before enabling the schedule in step 6, from a notebook in fixed batches (weekly worked: 143 batches over 2.7 years) instead of one huge INSERT. Each batch: delete its window, assert 0 rows are left, insert, count the rows; after each finished batch write its start date to a JSON checkpoint next to the notebook; show progress with tqdm. Pass criterion: the checkpoint lists every batch and the per-week row counts show no empty week."
  - "After any change of the query or the table schema, drop or truncate the table, delete the checkpoint and rerun every batch: the checkpoint records that a batch ran, not with which logic (a leftover checkpoint once kept 85 weeks on the old logic). Pass criterion: the first batch after the restart takes minutes, not seconds, and tqdm does not show millions of it/s."
  - "Before the full history load of step 7, size the query on its first batch with read-only approximate diagnostics (count, uniq, sort and partition keys from system.tables, sizes from system.parts, the per-query memory limit and max_threads). If a batch hits the per-query memory limit (Code 241), rewrite the query (filter on the small side, compare numbers instead of strings, drop DISTINCT/pair sets that a filter already implies, and check on a sample what the rewrite changes) instead of changing settings on a shared production server. Pass criterion: the peak memory of a batch stays well below the limit."
  - "While writing the SQL of step 1, store shop eligibility rules the business may want to change later as UInt8 flag columns computed per batch at window_end (bdf_core_full: shop_open_180d = date_opened <= window_end - 180, shop_transport_ok = date_transport_stop IS NULL, shop_is_fair = the name contains the fair marker), and keep hard filters only for conditions that clearly define the entity (bdf_core_full: channel_id = 1 and not closed at window_end; both still to be confirmed with the lead)."
  - "After the load run and record read-only checks: count, uniq(shop), uniq(book), min and max day; bytes per row per column from system.columns; duplicate keys (GROUP BY day, shop_id, book_id HAVING count() > 1 must return nothing); rows per week (no missing week); comparison with the previous table on the overlapping period and scope."

notes: >
  Follow-up needed: add a manual-only init DAG that (a) checks the target
  table is empty, (b) backfills the full history, (c) verifies rows were
  inserted — this was in the original issue scope (#18) but not built in
  v1. Also reconsider the delete+insert rolling-window approach vs. the
  original "fail if yesterday already exists" design — the rolling window
  is more forgiving of late-arriving source data but silently masks gaps
  older than the window.

  Follow-up work (2026-08-02, issue #18): the v1 SQL had several correctness
  bugs that under-counted sales, found while adding the id-based rubric
  filter and 30-day age filter. Sales joined on the wrong id column
  (cdm_retail_receipts.goods_id instead of goods_id_original — different
  id-spaces from the catalog/stock tables), and the rubric filter sourced
  from a new-releases-only table (ncat_first_180d_catalog) instead of the
  full catalog, silently excluding the entire backlist. Both fixed and
  verified: 0% of matched sales lost in the stock join, 84-90% of real
  Moscow book sales fall inside the eligible-books scope. Also did a manual
  one-time year backfill via DBeaver (TRUNCATE + single INSERT) — still not
  the init DAG scoped in step 3/#18, that gap remains open.

  Rule (2026-08-03, issue #18): do not source rubric/category data for this
  pipeline from analytics.ncat_first_180d_catalog — confirmed new-releases-only
  scope (see 2026-08-02 entry above), it silently excludes the backlist.
  A new rubricator, analytics.book_ekn_rubric (book_rubric_id / book_rubric_name,
  joined as recsys_catalog_pim.ekn = book_ekn_rubric.EKN_4), is the current
  candidate replacement — still needs the standard checks before it's used in
  the DAG: confirm EKN_4 is the right hierarchy level for recsys_catalog_pim.ekn
  (table appears to carry EKN_1..EKN_4 levels), check for fan-out (multiple
  rubrics per EKN, which would duplicate sales/stock rows on join), and measure
  the LEFT JOIN match-rate against the eligible-books universe before trusting
  its coverage.

  Open question (2026-08-04, issue #18): re-verified the 2026-08-02 sales-join
  fix (goods_id_original) with a corrected check — the original verification
  used LEFT JOIN + IS NULL, which is unreliable in ClickHouse: join_use_nulls
  is off by default, so an unmatched row gets the column's type default (0 /
  '') instead of NULL, and IS NULL silently never fires. Re-checked with
  LEFT ANTI JOIN instead, and the result contradicts the 2026-08-02 entry:
  goods_id_original matches only 94.5% of current stock book_ids, while plain
  goods_id matches 99.8% — better, not worse. Do not treat the sales-join fix
  as settled. Still needs: pull the ~8k goods_id_original values that fail to
  match and check whether it's a genuine id-space issue, delisted/edge-case
  items, or something that changed in the source tables since 2026-08-02.

