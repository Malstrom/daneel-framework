name: "Airflow rolling-window pipeline for ClickHouse showcase table"
work_type: "other"
created: "2026-07-27"
promoted_from: "clients/chitai-gorod/playbooks/other_airflow_showcase_pipeline.yml"
usage_count: 0
source_clients:
  - "chitai-gorod"

context:
  problem: >
    Need a scheduled Airflow pipeline that keeps a ClickHouse showcase/vitrina
    table up to date, joining two or more raw sources (e.g. stock and sales)
    at a fixed grain (e.g. day x entity x item), filtered to a client-specific
    subset of entities and categories.

steps:
  - "Define a shared SQL module (`*_sql.py`) exposing `TABLE_NAME`, a connection-id constant, and a `build_insert_sql_window(window_start, window_end)` function returning the full INSERT ... SELECT query. Load the client-specific filters (eligible entities, category/rubric rules) from `clients/{slug}/context.yml` rather than hardcoding them."
  - "Define a loader module (`*_loader.py`) with `run_window_load(window_start, window_end)`: open the DB client via the shared connection wrapper, log the pre-window row count, delete the window (with sync/wait-for-mutation settings if the engine needs it), assert the post-delete count is 0 (fail otherwise), run the insert from step 1, assert the post-insert count is > 0 (fail otherwise)."
  - "Define the daily DAG: fixed `start_date` (never a relative 'days ago'), a nightly schedule, `catchup=False`, `max_active_runs=1`, a failure-alert callback, and a single task that computes a rolling window `[today - N days, today - 1]` and calls `run_window_load`."
  - "If a downstream DAG consumes this table, chain a trigger-dag-run task after the load task, without waiting for its completion."
  - "Tag the DAG with team/domain/cadence tags for discoverability."
  - "Trigger the DAG manually once before enabling the schedule, and confirm row counts in the task logs."

notes: >
  A rolling delete+insert window (e.g. 7 days) is simpler to build than a
  strict "load yesterday only, fail if it already exists" design, and is
  more forgiving of late-arriving source data — but it silently masks gaps
  older than the window. If the use case needs a full audit trail or exact
  once-only loads, add a manual-only init DAG that checks the target table
  is empty, backfills full history, and verifies rows were inserted; this
  was scoped but not built in the first implementation (source: chitai-gorod,
  issue #18).

  Pitfalls found reusing this pattern (source: chitai-gorod, 2026-08-02):
  (1) when the raw fact table has multiple similarly-named id columns,
  verify empirically which one actually matches the dimension table's
  id-space before joining on it — a wrong-but-plausible column silently
  drops most rows with no error, it just under-counts. (2) A reference
  table used to derive a filter can be scoped narrower than its name
  implies (e.g. "new items only" instead of the full catalog) — confirm
  its population actually covers the intended universe before trusting it
  as a filter source. (3) Filter on the fact table's real partition/sort
  key, not just the semantically relevant date column, or every run scans
  the whole table regardless of the date range requested. (4) A source
  table may represent a zero/empty state by omitting the row entirely
  rather than writing an explicit zero/NULL — check the value distribution
  before assuming "row missing" means "no data" rather than "zero". (5)
  `NOT IN` silently drops NULLs on either side; wrap as
  `(col IS NULL OR col NOT IN (...))` when NULL should pass through a
  blacklist filter. (6, 2026-08-04) In ClickHouse specifically, don't use
  `LEFT JOIN` + `IS NULL`/`IS NOT NULL` to detect missing/matching rows —
  `join_use_nulls` is off by default, so an unmatched row gets the column's
  type default (`0`, `''`) instead of NULL, and the `IS NULL` check silently
  never fires. Looks like a clean 100% match / 0% missing regardless of the
  real data, no error thrown. Use `LEFT ANTI JOIN` instead (or explicitly
  `SET join_use_nulls = 1` for the session) — this cost a full afternoon of
  re-checking "verified" numbers that turned out to be wrong.
